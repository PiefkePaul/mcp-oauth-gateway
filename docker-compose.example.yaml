services:
  mcp-oauth-gateway:
    image: your-dockerhub-user/mcp-oauth-gateway:latest
    container_name: mcp-oauth-gateway
    restart: unless-stopped
    # The image runs as the unprivileged user 10001:10001. ./config and ./data
    # must be writable for that user:
    #   sudo chown -R 10001:10001 ./config ./data && chmod 700 ./config ./data
    # Alternatively keep the current owner of the folders and run the container
    # as that owner, e.g. on a NAS:
    # user: "1026:100"
    read_only: true
    tmpfs:
      # Scratch space for the gateway and native STDIO children. Not executable.
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # No host port by default: the reverse proxy reaches the gateway as
    # http://mcp-oauth-gateway:8080 through the gateway-edge network.
    # Without a reverse proxy in Docker, publish it on loopback only:
    # ports:
    #   - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    environment:
      MCP_GATEWAY_PUBLIC_BASE_URL: "https://mcp.example.com"
      MCP_GATEWAY_LISTEN_ADDR: ":8080"
      MCP_GATEWAY_ROUTES_PATH: "/config/routes.yaml"
      MCP_GATEWAY_AUTH_STORE_PATH: "/data/auth-store.enc"
      MCP_GATEWAY_AUTH_MASTER_KEY: "REPLACE_WITH_32_BYTE_BASE64_OR_HEX_KEY"
      MCP_GATEWAY_ACCOUNT_TITLE: "Example MCP Gateway"
      MCP_GATEWAY_ALLOW_SELF_SIGNUP: "false"
      MCP_GATEWAY_ACCESS_LOG: "false"
      MCP_GATEWAY_BOOTSTRAP_EMAIL: "admin@example.com"
      MCP_GATEWAY_BOOTSTRAP_PASSWORD: "REPLACE_WITH_LONG_RANDOM_PASSWORD"
      MCP_GATEWAY_ALLOWED_EMAIL_DOMAINS: "example.com"
      # Optional: only needed when a client such as Open WebUI registers a non-HTTPS,
      # non-loopback redirect URI, for example in a private LAN test setup.
      # Prefer setting Open WebUI's WEBUI_URL to its public HTTPS URL instead.
      MCP_GATEWAY_ALLOWED_REDIRECT_ORIGINS: ""
      MCP_GATEWAY_LAZY_CLIENT_REGISTRATION: "allowlist"
      MCP_GATEWAY_ALLOW_UNBOUND_TOKENS: "false"
      # Reverse proxies whose X-Forwarded-For is trusted for login throttling.
      # Empty means loopback and private networks. Behind Cloudflare also set
      # MCP_GATEWAY_CLIENT_IP_HEADER to "CF-Connecting-IP".
      MCP_GATEWAY_TRUSTED_PROXIES: ""
      MCP_GATEWAY_CLIENT_IP_HEADER: ""
      # Optional: enable only if the gateway should create/start/stop Docker containers.
      # Mounting docker.sock grants this container host-level Docker control.
      MCP_GATEWAY_DOCKER_MANAGEMENT_ENABLED: "false"
      MCP_GATEWAY_DOCKER_HOST: "unix:///var/run/docker.sock"
      MCP_GATEWAY_DOCKER_NETWORKS: "mcp-internal"
      # Optional: allow admins to build a minimal image from a verified binary artifact.
      # Requires Docker management and docker.sock access.
      MCP_GATEWAY_BUILD_ENABLED: "false"
      MCP_GATEWAY_BUILD_MAX_ARTIFACT_MB: "100"
      MCP_GATEWAY_BUILD_ALLOWED_DOWNLOAD_HOSTS: "github.com,objects.githubusercontent.com,github-releases.githubusercontent.com,release-assets.githubusercontent.com"
      MCP_GATEWAY_BUILD_DEFAULT_BASE_IMAGE: "debian:bookworm-slim"
      MCP_GATEWAY_BUILD_ALLOWED_BASE_IMAGES: "debian:bookworm-slim"
      # Optional: install native STDIO MCP binaries from upload, HTTPS URL or GitHub releases.
      MCP_GATEWAY_STDIO_INSTALL_ENABLED: "false"
      MCP_GATEWAY_STDIO_STORE_DIR: "/data/stdio-mcp"
      MCP_GATEWAY_STDIO_MAX_ARTIFACT_MB: "100"
      MCP_GATEWAY_STDIO_ALLOWED_DOWNLOAD_HOSTS: "github.com,objects.githubusercontent.com,github-releases.githubusercontent.com,release-assets.githubusercontent.com"
      MCP_GATEWAY_STDIO_ALLOW_ANY_DOWNLOAD_HOST: "false"
      MCP_GATEWAY_OPENAPI_STORE_DIR: "/data/openapi"
      # Optional: read the routes' upstream bearers from a file that an agent
      # (for example the Infisical agent) keeps up to date. See README,
      # "Upstream Bearer aus einer Secrets-Datei". Mount the folder, not the
      # single file, and make it readable for the container user.
      # MCP_GATEWAY_ROUTE_SECRETS_FILE: "/run/gateway-secrets/gateway-routes.env"
      # MCP_GATEWAY_ROUTE_SECRETS_RELOAD: "10s"
      # MCP_GATEWAY_ROUTE_SECRETS_STRICT: "false"
    volumes:
      - ./config:/config
      - ./data:/data
      # Optional: folder with the route secrets file, read-only.
      # - ./secrets/gateway:/run/gateway-secrets:ro
      # Optional: native STDIO MCP executables made available to the gateway.
      # - ./tools:/tools:ro
      # Required only when MCP_GATEWAY_DOCKER_MANAGEMENT_ENABLED=true:
      # - /var/run/docker.sock:/var/run/docker.sock
    # The unprivileged user then also needs the group that owns the socket on
    # the host (see `stat -c %g /var/run/docker.sock`):
    # group_add:
    #   - "999"
    networks:
      - gateway-edge
      - mcp-internal

  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    container_name: n8n-mcp
    restart: unless-stopped
    environment:
      MCP_MODE: "http"
      PORT: "8080"
      AUTH_TOKEN: "REPLACE_WITH_INTERNAL_N8N_AUTH_TOKEN"
    expose:
      - "8080"
    networks:
      - mcp-internal

  portainer-mcp:
    image: your-dockerhub-user/portainer-mcp-http:latest
    container_name: portainer-mcp
    restart: unless-stopped
    environment:
      PORTAINER_TOKEN: "REPLACE_WITH_PORTAINER_TOKEN"
      PORTAINER_SERVER: "https://portainer:9443"
      MCP_TRANSPORT: "http"
      MCP_HTTP_LISTEN_ADDR: ":8080"
      DISABLE_VERSION_CHECK: "true"
      READ_ONLY: "false"
    expose:
      - "8080"
    volumes:
      - ./portainer-mcp-data:/data
    networks:
      - mcp-internal

  camoufox-mcp:
    image: your-registry/camoufox-mcp:latest
    container_name: camoufox-mcp
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: "http"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3000"
      MCP_PATH: "/mcp"
      MCP_HEALTH_PATH: "/health"
      MCP_AUTH_TOKEN: "REPLACE_WITH_INTERNAL_CAMOUFOX_AUTH_TOKEN"
    expose:
      - "3000"
    networks:
      - mcp-internal

networks:
  # Dedicated network that holds only the reverse proxy and the gateway. Do not
  # reuse a shared proxy network with unrelated containers: everything in it
  # could talk to the gateway and, through other shared networks, to the MCP
  # servers directly. Create it once and attach the proxy to it:
  #   docker network create mcp-gateway-edge
  #   docker network connect mcp-gateway-edge <reverse-proxy-container>
  gateway-edge:
    name: mcp-gateway-edge
    external: true
  # Gateway and its MCP upstreams only. The upstreams publish no host ports.
  mcp-internal:
    driver: bridge
