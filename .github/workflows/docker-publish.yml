name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "*.*.*"]

# Images go to the Gitea container registry on the NAS (pulled as
# git.scholz-cloud.de/piefkepaul/mcp-oauth-gateway) and, as an off-site copy,
# to Docker Hub. Built on the NAS runners, which push to Gitea inside ci-net as
# plain http (gitea:3000): the public name runs through Cloudflare, which
# rejects request bodies over 100 MB. Nothing deploys from here.
env:
  # The build record would be uploaded as an Actions artifact (full GitHub storage).
  DOCKER_BUILD_RECORD_UPLOAD: false
  GITEA_REGISTRY: gitea:3000

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","nas","mcp-oauth-gateway"]') }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Builder in the slot's network namespace (ci-net): resolves gitea:3000, plain http.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."gitea:3000"]
              http = true
              insecure = true

      - name: Log in to Gitea registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITEA_REGISTRY }}
          username: ${{ vars.GITEA_REGISTRY_USER || 'piefkepaul' }}
          password: ${{ secrets.GITEA_REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reproduces the tags the image previously carried: a short-SHA tag on
      # every commit, latest/beta/openwebui-test floating tags on every push
      # to main, and a version tag when a version git tag (v1.2.3 or 1.2.3)
      # is pushed. Every tag goes to Gitea and Docker Hub.
      - name: Compute image tags
        id: tags
        env:
          IMAGES: gitea:3000/piefkepaul/mcp-oauth-gateway piefkepaul/mcp-oauth-gateway
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          sha_short=$(git rev-parse --short=7 HEAD)
          names="$sha_short"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            names="$names latest beta openwebui-test"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            names="$names ${version#v}"
          fi
          tags=""
          for image in $IMAGES; do
            for name in $names; do
              tags="${tags:+$tags,}$image:$name"
            done
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
