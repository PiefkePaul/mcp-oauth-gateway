name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reproduces the tags the image previously carried: a short-SHA tag on
      # every commit, latest/beta/openwebui-test floating tags on every push
      # to main, and a version tag when a version git tag (v1.2.3 or 1.2.3)
      # is pushed.
      - name: Compute image tags
        id: tags
        env:
          IMAGE: piefkepaul/mcp-oauth-gateway
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          sha_short=$(git rev-parse --short=7 HEAD)
          tags="$IMAGE:$sha_short"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags="$tags,$IMAGE:latest,$IMAGE:beta,$IMAGE:openwebui-test"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            version="${version#v}"
            tags="$tags,$IMAGE:$version"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
